name: CI

on:
  push:
  pull_request:

jobs:
  repository-integrity:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install lightweight CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Compile released Python code
        run: python -m compileall -q .
      - name: Encoder smoke tests
        run: python -m unittest discover -s tests -v
      - name: Verify frozen aggregate evidence
        run: python tools/verify_frozen_results.py
      - name: Generate candidate release manifest
        run: python tools/generate_release_manifest.py > /tmp/release-manifest.sha256
      - name: Upload candidate release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manifest-candidate
          path: /tmp/release-manifest.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Verify checked-in release manifest when present
        if: ${{ hashFiles('RELEASE_MANIFEST.sha256') != '' }}
        run: diff -u RELEASE_MANIFEST.sha256 /tmp/release-manifest.sha256
